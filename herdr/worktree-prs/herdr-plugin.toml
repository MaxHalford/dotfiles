id = "dev.max.worktree-prs"
name = "Shipr"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Commit, push, and publish pull requests from repository worktrees"
platforms = ["macos"]

[[actions]]
id = "open"
title = "Open Shipr"
contexts = ["workspace"]
command = ["python3", "open.py"]

[[panes]]
id = "board"
title = "Shipr"
placement = "popup"
width = "90%"
height = "80%"
command = ["python3", "board.py"]
