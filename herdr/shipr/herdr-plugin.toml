id = "dev.max.worktree-prs"
name = "shipr"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Browse, open, publish, and push pull requests with Herdr worktrees"
platforms = ["macos"]

[[actions]]
id = "open"
title = "Open shipr"
description = "Browse and work with GitHub pull requests in this workspace"
contexts = ["workspace"]
command = ["python3", "open.py"]

[[panes]]
id = "board"
title = "shipr"
placement = "popup"
width = "90%"
height = "80%"
command = ["python3", "board.py"]
