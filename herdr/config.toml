onboarding = false

[theme]
name = "terminal"
auto_switch = true
light_name = "terminal"
dark_name = "terminal"

[theme.custom.light]
# Rosé Pine Dawn's pine and base give the active tab readable light text.
accent = "#286983"
panel_bg = "#faf4ed"
# Codex's light prompt fill over the Ghostty Dawn background.
active_row_bg = "#f0eae4"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "login"

[experimental]
kitty_graphics = true
# Keep pane scrollback across full server restarts.
pane_history = true

[ui]
copy_on_select = true
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
prompt_new_tab_name = false

status_indicators = "symbols"
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "dev.volpestyle.mermaid-preview.open"
description = "open Mermaid preview"

[[keys.command]]
key = "cmd+g"
type = "plugin_action"
command = "dev.max.worktree-prs.open"
description = "open shipr"

[[keys.command]]
key = "cmd+d"
type = "shell"
command = "sh \"$HOME/dotfiles/herdr/reviewr-toggle.sh\""
description = "review changes and send comments to agent"

[[keys.command]]
key = "cmd+e"
type = "shell"
command = "/opt/homebrew/bin/code \"${HERDR_ACTIVE_PANE_CWD:-.}\""
description = "open current code path in VS Code"
