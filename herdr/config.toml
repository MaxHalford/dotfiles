onboarding = false

[theme]
name = "rose-pine"
auto_switch = true
light_name = "rose-pine-dawn"
dark_name = "rose-pine"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "login"

[experimental]
kitty_graphics = true

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "dev.volpestyle.mermaid-preview.open"
description = "open Mermaid preview"
