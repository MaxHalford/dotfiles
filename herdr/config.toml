onboarding = false

[theme]
name = "terminal"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "login"

[experimental]
kitty_graphics = true

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "dev.volpestyle.mermaid-preview.open"
description = "open Mermaid preview"

[[keys.command]]
key = "cmd+g"
type = "plugin_action"
command = "dev.max.worktree-prs.open"
description = "open shipr"

[[keys.command]]
key = "cmd+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review changes and send comments to agent"
